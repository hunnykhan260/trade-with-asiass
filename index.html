<!-- Analysis Feed -->
<section id="analysis" class="border-b border-purple-500/10 py-20 lg:py-28">
    <div class="mx-auto max-w-7xl px-5 lg:px-8">
        <div>
            <span class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-widest text-purple-400">
                <i data-lucide="bar-chart-2" class="h-4 w-4"></i>Daily Setups
            </span>
            <h2 class="mt-3 text-3xl font-extrabold text-white sm:text-4xl">Analysis Feed</h2>
            <p class="mt-3 max-w-xl text-sm text-slate-400 sm:text-base">Fresh technical breakdowns from the desk, updated every session.</p>
        </div>

        <div class="mt-12 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
            
            <!-- XAU/USD Card -->
            <div onclick="openAnalysis('xau')" class="card-glow cursor-pointer rounded-2xl border border-purple-500/15 bg-white/[0.03] overflow-hidden transition-all hover:scale-[1.02]">
                <div class="relative flex h-40 items-center justify-center bg-gradient-to-br from-amber-600/20 via-yellow-600/10 to-transparent">
                    <span class="text-4xl font-black text-amber-400/80">XAU</span>
                </div>
                <div class="p-5 text-center">
                    <h3 class="text-xl font-bold text-white">XAU/USD</h3>
                    <p class="mt-1 text-xs text-slate-500">Click to view analysis</p>
                </div>
            </div>

            <!-- EUR/USD Card -->
            <div onclick="openAnalysis('eur')" class="card-glow cursor-pointer rounded-2xl border border-purple-500/15 bg-white/[0.03] overflow-hidden transition-all hover:scale-[1.02]">
                <div class="relative flex h-40 items-center justify-center bg-gradient-to-br from-blue-600/20 via-indigo-600/10 to-transparent">
                    <span class="text-4xl font-black text-blue-400/80">EUR</span>
                </div>
                <div class="p-5 text-center">
                    <h3 class="text-xl font-bold text-white">EUR/USD</h3>
                    <p class="mt-1 text-xs text-slate-500">Click to view analysis</p>
                </div>
            </div>

            <!-- USD/JPY Card -->
            <div onclick="openAnalysis('jpy')" class="card-glow cursor-pointer rounded-2xl border border-purple-500/15 bg-white/[0.03] overflow-hidden transition-all hover:scale-[1.02]">
                <div class="relative flex h-40 items-center justify-center bg-gradient-to-br from-purple-600/20 via-fuchsia-600/10 to-transparent">
                    <span class="text-4xl font-black text-purple-400/80">JPY</span>
                </div>
                <div class="p-5 text-center">
                    <h3 class="text-xl font-bold text-white">USD/JPY</h3>
                    <p class="mt-1 text-xs text-slate-500">Click to view analysis</p>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- Analysis Modal -->
<div id="analysisModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="relative w-full max-w-4xl rounded-2xl border border-purple-500/30 bg-[#0a0a14] overflow-hidden">
        
        <!-- Close Button -->
        <button onclick="closeAnalysis()" class="absolute right-4 top-4 z-10 rounded-full bg-white/10 p-2 text-white hover:bg-white/20">
            <i data-lucide="x" class="h-5 w-5"></i>
        </button>

        <!-- Modal Content -->
        <div class="p-6">
            <h3 id="modalTitle" class="text-2xl font-bold text-white mb-4"></h3>
            
            <!-- Yahan aap chart / image / video daaloge -->
            <div id="modalContent" class="min-h-[300px] rounded-xl bg-black/40 flex items-center justify-center border border-purple-500/20">
                <!-- Content yahan dynamically aayega -->
            </div>
        </div>
    </div>
</div>

<script>
    // Analysis Modal Functions
    function openAnalysis(pair) {
        const modal = document.getElementById('analysisModal');
        const title = document.getElementById('modalTitle');
        const content = document.getElementById('modalContent');

        // Pair ke hisaab se title set karo
        if (pair === 'xau') {
            title.innerText = 'XAU/USD Analysis';
            content.innerHTML = `
                <!-- Yahan XAU chart/image/video daalna -->
                <img src="xau-chart.jpg" alt="XAU/USD Chart" class="w-full rounded-lg" onerror="this.parentElement.innerHTML='<p class=\\'text-slate-400\\'>XAU/USD chart yahan upload karein</p>'">
            `;
        } 
        else if (pair === 'eur') {
            title.innerText = 'EUR/USD Analysis';
            content.innerHTML = `
                <!-- Yahan EUR chart/image/video daalna -->
                <img src="eur-chart.jpg" alt="EUR/USD Chart" class="w-full rounded-lg" onerror="this.parentElement.innerHTML='<p class=\\'text-slate-400\\'>EUR/USD chart yahan upload karein</p>'">
            `;
        } 
        else if (pair === 'jpy') {
            title.innerText = 'USD/JPY Analysis';
            content.innerHTML = `
                <!-- Yahan JPY chart/image/video daalna -->
                <img src="jpy-chart.jpg" alt="USD/JPY Chart" class="w-full rounded-lg" onerror="this.parentElement.innerHTML='<p class=\\'text-slate-400\\'>USD/JPY chart yahan upload karein</p>'">
            `;
        }

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        lucide.createIcons();
    }

    function closeAnalysis() {
        const modal = document.getElementById('analysisModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    // Modal bahar click se band ho
    document.getElementById('analysisModal').addEventListener('click', function(e) {
        if (e.target === this) closeAnalysis();
    });
</script>
